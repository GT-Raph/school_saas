<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Choose School
    </title>

</head>

<body>

<div
    style="
        max-width: 650px;
        margin: 80px auto;
        font-family: Arial, sans-serif;
    "
>

    <h1>
        Choose a school
    </h1>

    <p>
        Your account belongs to more than one school.
    </p>


    {% for membership in memberships %}

        <form
            method="post"
            style="
                margin-bottom: 15px;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 10px;
            "
        >

            {% csrf_token %}

            <input
                type="hidden"
                name="membership_id"
                value="{{ membership.id }}"
            >

            <strong>
                {{ membership.school.name }}
            </strong>


            <div
                style="
                    margin: 8px 0 15px;
                    color: #666;
                "
            >

                {% for role in membership.roles.all %}

                    {{ role.name }}

                    {% if not forloop.last %}
                        ·
                    {% endif %}

                {% endfor %}

            </div>


            <button type="submit">
                Continue
            </button>

        </form>

    {% endfor %}

</div>

</body>

</html>
