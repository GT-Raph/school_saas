<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Login
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f3f4f6;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .login-card {
            width: 420px;
            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );
        }

        h1 {
            margin-top: 0;
        }

        .school {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 20px;

            border:
                1px solid #d1d5db;

            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;

            background: #111827;
            color: white;

            border: 0;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        .errors {
            background: #fee2e2;
            color: #991b1b;

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 6px;
        }

    </style>

</head>


<body>

<div class="login-card">

    <h1>
        School Portal
    </h1>

    <div class="school">

        {% if request.school %}

            {{ request.school.name }}

        {% else %}

            School could not be identified

        {% endif %}

    </div>


    {% if form.non_field_errors %}

        <div class="errors">

            {{ form.non_field_errors }}

        </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}


        <label>
            Username
        </label>

        {{ form.username }}


        <label>
            Password
        </label>

        {{ form.password }}


        <button type="submit">
            Sign In
        </button>

    </form>

</div>

</body>
</html>
