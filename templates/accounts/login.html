{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Login
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        /* --- Mobile default: glass card over full-bleed image --- */
        .login-card {
            width: 100%;
            max-width: 420px;

            background: linear-gradient(
                160deg,
                rgba(60, 30, 100, 0.35),
                rgba(32, 26, 43, 0.45)
            );
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            padding: 40px;

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;

            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);

            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
        }

        h1 {
            margin-top: 0;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .school {
            color: #e6dcfa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #f5f1fb;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 20px;

            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;

            font-size: 15px;
            color: #201a2b;

            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.35);
        }

        button {
            width: 100%;
            padding: 13px;

            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: white;

            border: 0;
            border-radius: 8px;

            font-size: 16px;
            font-weight: 600;
            cursor: pointer;

            box-shadow: 0 6px 16px rgba(124, 58, 237, 0.4);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #6d28d9, #7c3aed);
            box-shadow: 0 8px 20px rgba(109, 40, 217, 0.5);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .errors {
            background: #ffeaea;
            color: #a63737;
            border: 1px solid #ffd5d5;

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 8px;
        }

        /* --- Tablet and up: split panel layout --- */
        @media (min-width: 768px) {

            body {
                align-items: stretch;
                justify-content: flex-start;
                padding: 0;
                background-attachment: scroll;
            }

            .login-card {
                width: 40%;
                min-width: 380px;
                max-width: 640px;

                height: 100vh;

                background: linear-gradient(165deg, #ffffff, #f6f3fb);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;

                border: 0;
                border-right: 1px solid #ece8f1;
                border-radius: 0;

                box-shadow: 6px 0 30px rgba(61, 43, 78, 0.12);

                padding: 60px;
            }

            h1 {
                color: #201a2b;
            }

            .school {
                color: #7c3aed;
                font-weight: 600;
                margin-bottom: 40px;
            }

            label {
                color: #201a2b;
            }

            input {
                background-color: #ffffff;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                border: 1px solid #ddd6e5;
                border-radius: 8px;
                color: #201a2b;
            }

        }

    </style>

</head>


<body style="--bg-image: url('{% static 'assets/school.png' %}');">
<div class="login-card">

    <h1>
        School Portal
    </h1>

    <div class="school">

        {% if request.school %}

            {{ request.school.name }}

        {% else %}

            School could not be identified

        {% endif %}

    </div>


    {% if form.non_field_errors %}

        <div class="errors">

            {{ form.non_field_errors }}

        </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}


        <label>
            Username
        </label>

        {{ form.username }}


        <label>
            Password
        </label>

        {{ form.password }}


        <button type="submit">
            Sign In
        </button>

    </form>

</div>

</body>
</html>
