<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login Request Error
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background: #f7f5fa;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #111827;
        }

        .login-card {
            width: 100%;
            max-width: 460px;

            padding: 36px;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 14px;

            box-shadow:
                0 12px 35px
                rgba(
                    17,
                    24,
                    39,
                    0.08
                );
        }

        h1 {
            margin:
                0
                0
                14px;

            font-size: 26px;
            line-height: 1.2;
        }

        p {
            margin:
                0
                0
                14px;

            color: #6b7280;

            font-size: 15px;
            line-height: 1.6;
        }

        .error-message {
            padding: 14px 16px;

            margin:
                20px
                0;

            background: #f9fafb;

            border: 1px solid #e5e7eb;
            border-radius: 8px;

            color: #374151;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            margin-top: 8px;

            padding:
                12px
                18px;

            background: #111827;
            color: #ffffff;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 700;

            text-decoration: none;
        }

        .button:hover {
            background: #1f2937;
        }
    </style>
</head>

<body>

    <main class="login-card">

        <h1>
            Login Request Error
        </h1>

        <div class="error-message">
            {{ error }}
        </div>

        <p>
            The login request may have expired,
            already been used, or may belong to
            another school.
        </p>

        <a
            href="{{ central_login_url }}"
            class="button"
        >
            Return to Login
        </a>

    </main>

</body>
</html>
