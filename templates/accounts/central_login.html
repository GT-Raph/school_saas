{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        School Platform Login
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            font-family:
                Inter,
                "Segoe UI",
                sans-serif;

            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color:
                #231d2b;
        }

        /* --- Mobile default: single glass card --- */
        .login-card {
            width: 100%;
            max-width: 430px;

            padding: 40px;

            background: linear-gradient(
                160deg,
                rgba(25, 25, 113, 0.55),
                rgba(21, 96, 189, 0.45)
            );
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;

            box-shadow: 0 24px 50px rgba(20, 20, 24, 0.25);
        }


        .brand {
            color: #cfe0fb;

            font-size: 20px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.1em;
        }

         h1 {
            margin: 13px 0 8px;

            font-size: 28px;

            letter-spacing: -0.04em;

            color: #ffffff;
        }

        .description {
            margin: 0 0 28px;

            color: rgba(255, 255, 255, 0.78);

            font-size: 15px;

            line-height: 1.5;
        }

         form p {
            margin: 0 0 17px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-size: 12px;
            font-weight: 700;

            color: rgba(255, 255, 255, 0.9);
        }

       input {
            width: 100%;

            padding: 12px 13px;

            background: #f4f4f6;

            border: none;
            border-radius: 9px;

            font: inherit;
            color: #201a2b;

            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

         input:focus {
            outline: none;
            border-color: #1560bd;
            box-shadow: 0 0 0 3px rgba(21, 96, 189, 0.3);
        }

        button {
            width: 100%;

            margin-top: 8px;

            padding: 13px;

            color: #ffffff;
            background: linear-gradient(135deg, #1560bd, #1f75fe);

            border: none;
            border-radius: 9px;

            font-weight: 800;

            cursor: pointer;

            box-shadow: 0 6px 16px rgba(21, 96, 189, 0.34);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
        }

         button:hover {
            background: linear-gradient(135deg, #124f9e, #1560bd);
            box-shadow: 0 8px 20px rgba(21, 96, 189, 0.44);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .errorlist {
            padding: 12px;

            margin: 0 0 20px;

            list-style: none;

            background: #ffeaea;
            color: #a63737;
            border: 1px solid #ffd5d5;
            border-radius: 8px;

            font-size: 12px;
        }

         /* --- Tablet and up: split panel layout --- */
        @media (min-width: 768px) {

            body {
                align-items: stretch;
                justify-content: flex-start;
                padding: 0;
                background-attachment: fixed;
            }

            .login-card {
                flex: 0 0 420px;
                max-width: 420px;

                height: 100vh;

                display: flex;
                flex-direction: column;
                justify-content: center;

                background: linear-gradient(150deg, #191971, #2f2fa8 55%, #3b3bc4);

                border: 0;
                border-radius: 0;

                box-shadow: -6px 0 30px rgba(20, 20, 24, 0.15);

                padding: 60px;
            }

        }

    </style>

</head>


<body style="--bg-image: url('{% static 'assets/school.png' %}');">

<div class="login-card">

    <div class="brand">
        School Management SaaS
    </div>

    <h1>
        Sign in
    </h1>

    <p class="description">
        Enter your account details.
        We will automatically find the
        school or schools assigned to you.
    </p>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Continue
        </button>

    </form>

</div>

</body>

</html>
