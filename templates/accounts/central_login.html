<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        School Platform Login
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            font-family:
                Inter,
                "Segoe UI",
                sans-serif;

            background:
                #f4f0fb;

            color:
                #231d2b;
        }

        .login-card {
            width: min(
                430px,
                100%
            );

            padding: 38px;

            background: white;

            border:
                1px solid #ebe5f1;

            border-radius: 20px;

            box-shadow:
                0 20px 60px
                rgba(
                    57,
                    40,
                    74,
                    0.1
                );
        }

        .brand {
            color: #7c3aed;

            font-size: 13px;
            font-weight: 800;

            text-transform:
                uppercase;

            letter-spacing:
                0.08em;
        }

        h1 {
            margin:
                13px
                0
                8px;

            font-size: 28px;

            letter-spacing:
                -0.04em;
        }

        .description {
            margin:
                0
                0
                28px;

            color: #766f80;

            font-size: 13px;

            line-height: 1.5;
        }

        form p {
            margin:
                0
                0
                17px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-size: 12px;
            font-weight: 700;
        }

        input {
            width: 100%;

            padding:
                12px
                13px;

            border:
                1px solid #ded7e6;

            border-radius: 9px;

            font: inherit;
        }

        button {
            width: 100%;

            margin-top: 8px;

            padding: 13px;

            color: white;
            background: #7c3aed;

            border: 0;
            border-radius: 9px;

            font-weight: 800;

            cursor: pointer;
        }

        .errorlist {
            padding: 0;

            color: #b42318;

            font-size: 12px;

            list-style: none;
        }

    </style>

</head>


<body>

<div class="login-card">

    <div class="brand">
        School Management SaaS
    </div>

    <h1>
        Sign in
    </h1>

    <p class="description">
        Enter your account details.
        We will automatically find the
        school or schools assigned to you.
    </p>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Continue
        </button>

    </form>

</div>

</body>

</html>
