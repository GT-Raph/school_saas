<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Change Password
    </title>

</head>

<body>

<div
    style="
        max-width: 500px;
        margin: 80px auto;
        font-family: Arial, sans-serif;
    "
>

    <h1>
        Change Your Temporary Password
    </h1>

    <p>
        You must create a private password
        before continuing.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Change Password
        </button>

    </form>

</div>

</body>

</html>
